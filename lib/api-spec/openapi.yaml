openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/doctors:
    get:
      operationId: listDoctors
      tags: [admin]
      summary: List all doctors
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doctor"
  /admin/doctors/pending:
    get:
      operationId: listPendingDoctors
      tags: [admin]
      summary: List pending doctors
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doctor"
  /admin/doctors/{id}/approve:
    patch:
      operationId: approveDoctor
      tags: [admin]
      summary: Approve a doctor
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
  /admin/doctors/{id}/reject:
    patch:
      operationId: rejectDoctor
      tags: [admin]
      summary: Reject a doctor
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
  /admin/doctors/{id}/onboarding:
    patch:
      operationId: updateDoctorOnboarding
      tags: [admin]
      summary: Update doctor onboarding status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
  /admin/doctors/{id}:
    delete:
      operationId: deleteDoctor
      tags: [admin]
      summary: Delete a doctor and their user account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /admin/notifications:
    get:
      operationId: listAdminNotifications
      tags: [admin]
      summary: List admin notifications
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminNotification"
    delete:
      operationId: clearAdminNotifications
      tags: [admin]
      summary: Clear all admin notifications
      responses:
        "204":
          description: Cleared
  /admin/notifications/{id}/read:
    patch:
      operationId: markAdminNotificationRead
      tags: [admin]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotification"
  /admin/specialties:
    get:
      operationId: listSpecialties
      tags: [admin]
      summary: List all specialties
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Specialty"
    post:
      operationId: createSpecialty
      tags: [admin]
      summary: Create a specialty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialtyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialty"
  /admin/specialties/{id}:
    put:
      operationId: updateSpecialty
      tags: [admin]
      summary: Update a specialty
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialtyUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialty"
    delete:
      operationId: deleteSpecialty
      tags: [admin]
      summary: Delete a specialty
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: No Content
  /admin/services:
    get:
      operationId: listServices
      tags: [admin]
      summary: List all services
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [admin]
      summary: Create a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /admin/services/{id}:
    put:
      operationId: updateService
      tags: [admin]
      summary: Update a service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [admin]
      summary: Delete a service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: No Content
  /admin/cities:
    get:
      operationId: listCities
      tags: [admin]
      summary: List all cities
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"
    post:
      operationId: createCity
      tags: [admin]
      summary: Create a city
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
  /admin/cities/{id}:
    put:
      operationId: updateCity
      tags: [admin]
      summary: Update a city
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
    delete:
      operationId: deleteCity
      tags: [admin]
      summary: Delete a city
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: No Content
  /admin/areas:
    get:
      operationId: listAreas
      tags: [admin]
      summary: List all areas
      parameters:
        - name: cityId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"
    post:
      operationId: createArea
      tags: [admin]
      summary: Create an area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
  /admin/areas/{id}:
    put:
      operationId: updateArea
      tags: [admin]
      summary: Update an area
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
    delete:
      operationId: deleteArea
      tags: [admin]
      summary: Delete an area
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: No Content
  /admin/reports:
    get:
      operationId: getReports
      tags: [admin]
      summary: Get admin analytics reports
      parameters:
        - name: doctorId
          in: query
          schema:
            type: integer
        - name: medicalCenterId
          in: query
          schema:
            type: integer
        - name: cityId
          in: query
          schema:
            type: integer
        - name: areaId
          in: query
          schema:
            type: integer
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        nameAr: { type: [string, "null"] }
        phone: { type: string }
        email: { type: [string, "null"] }
        role: { type: string }
        doctorId: { type: [integer, "null"] }
        accountStatus: { type: [string, "null"] }
      required:
        - id
        - name
        - phone
        - role
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/AuthUser"
      required:
        - token
        - user
    SignUpRequest:
      type: object
      properties:
        name: { type: string }
        nameAr: { type: [string, "null"] }
        phone: { type: string }
        email: { type: [string, "null"] }
        nationalId: { type: [string, "null"] }
        syndicateNumber: { type: [string, "null"] }
        password: { type: string }
        role: { type: string, enum: [patient, doctor, medical_center] }
        specialtyId: { type: [integer, "null"] }
        cityId: { type: [integer, "null"] }
        experience: { type: [integer, "null"] }
        license: { type: [string, "null"] }
      required:
        - name
        - phone
        - password
        - role
    SignInRequest:
      type: object
      properties:
        phone: { type: string }
        password: { type: string }
      required:
        - phone
        - password
    Doctor:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        name: { type: string }
        specialtyId: { type: [integer, "null"] }
        specialtyName: { type: [string, "null"] }
        cityId: { type: [integer, "null"] }
        cityName: { type: [string, "null"] }
        areaId: { type: [integer, "null"] }
        areaName: { type: [string, "null"] }
        clinicAddress: { type: [string, "null"] }
        bio: { type: [string, "null"] }
        image: { type: [string, "null"] }
        fee: { type: [integer, "null"] }
        experience: { type: [integer, "null"] }
        license: { type: [string, "null"] }
        syndicateNumber: { type: [string, "null"] }
        email: { type: [string, "null"] }
        rating: { type: number }
        reviews: { type: integer }
        accountStatus: { type: string }
        onboardingStatus: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
        - id
        - userId
        - name
        - accountStatus
        - onboardingStatus
        - createdAt
        - updatedAt
    OnboardingUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
      required:
        - status
    Specialty:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        nameAr: { type: string }
        shortName: { type: [string, "null"] }
        description: { type: [string, "null"] }
        displayOrder: { type: integer }
        isActive: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
        - id
        - name
        - nameAr
        - displayOrder
        - isActive
        - createdAt
        - updatedAt
    SpecialtyInput:
      type: object
      properties:
        name: { type: string }
        nameAr: { type: string }
        shortName: { type: string }
        description: { type: string }
        displayOrder: { type: integer }
      required:
        - name
        - nameAr
    SpecialtyUpdate:
      type: object
      properties:
        name: { type: string }
        nameAr: { type: string }
        shortName: { type: string }
        description: { type: string }
        displayOrder: { type: integer }
        isActive: { type: string }
    Service:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        nameAr: { type: string }
        displayOrder: { type: integer }
        isActive: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
        - id
        - name
        - nameAr
        - displayOrder
        - isActive
        - createdAt
        - updatedAt
    ServiceInput:
      type: object
      properties:
        name: { type: string }
        nameAr: { type: string }
        displayOrder: { type: integer }
      required:
        - name
        - nameAr
    ServiceUpdate:
      type: object
      properties:
        name: { type: string }
        nameAr: { type: string }
        displayOrder: { type: integer }
        isActive: { type: string }
    City:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        nameAr: { type: string }
        displayOrder: { type: integer }
        isActive: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
        - id
        - name
        - nameAr
        - displayOrder
        - isActive
        - createdAt
        - updatedAt
    CityInput:
      type: object
      properties:
        name: { type: string }
        nameAr: { type: string }
        displayOrder: { type: integer }
      required:
        - name
        - nameAr
    CityUpdate:
      type: object
      properties:
        name: { type: string }
        nameAr: { type: string }
        displayOrder: { type: integer }
        isActive: { type: string }
    Area:
      type: object
      properties:
        id: { type: integer }
        cityId: { type: integer }
        name: { type: string }
        nameAr: { type: string }
        displayOrder: { type: integer }
        isActive: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
        - id
        - cityId
        - name
        - nameAr
        - displayOrder
        - isActive
        - createdAt
        - updatedAt
    AreaInput:
      type: object
      properties:
        cityId: { type: integer }
        name: { type: string }
        nameAr: { type: string }
        displayOrder: { type: integer }
      required:
        - cityId
        - name
        - nameAr
    AreaUpdate:
      type: object
      properties:
        cityId: { type: integer }
        name: { type: string }
        nameAr: { type: string }
        displayOrder: { type: integer }
        isActive: { type: string }
    AdminNotification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        userId: { type: [integer, "null"] }
        isRead: { type: boolean }
        createdAt: { type: string }
      required:
        - id
        - type
        - title
        - body
        - isRead
        - createdAt
    ReportsResponse:
      type: object
      properties:
        overview:
          type: object
          properties:
            totalUsers: { type: integer }
            totalDoctors: { type: integer }
            totalPatients: { type: integer }
            totalMedicalCenters: { type: integer }
            totalAppointments: { type: integer }
            totalReviews: { type: integer }
            totalClinics: { type: integer }
            totalPayments: { type: integer }
            totalRevenue: { type: number }
            confirmedAppointments: { type: integer }
            rejectedAppointments: { type: integer }
            pendingAppointments: { type: integer }
            completedAppointments: { type: integer }
          required:
            - totalUsers
            - totalDoctors
            - totalPatients
            - totalMedicalCenters
            - totalAppointments
            - totalReviews
            - totalClinics
            - totalPayments
            - totalRevenue
            - confirmedAppointments
            - rejectedAppointments
            - pendingAppointments
            - completedAppointments
        doctorsByStatus:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
            required: [label, count]
        doctorsBySpecialty:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
            required: [label, count]
        doctorsByCity:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
            required: [label, count]
        doctorsBySubscription:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
            required: [label, count]
        appointmentsByStatus:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
            required: [label, count]
        appointmentsByMonth:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
            required: [label, count]
        reviewsByRating:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
            required: [label, count]
        centersByCity:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
            required: [label, count]
        paymentsByMonth:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
              revenue: { type: number }
            required: [label, count, revenue]
        recentSignups:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
            required: [label, count]
      required:
        - overview
        - doctorsByStatus
        - doctorsBySpecialty
        - doctorsByCity
        - doctorsBySubscription
        - appointmentsByStatus
        - appointmentsByMonth
        - reviewsByRating
        - centersByCity
        - paymentsByMonth
        - recentSignups
